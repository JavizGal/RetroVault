<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retro Vault</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    
    <link rel="stylesheet" href="Estilos.css">
</head>
<body>

    <!------------- Cabecera TopBar ------------>
    
    <header class="Cabecera">
        <div class="Logo">RETRO<span>VAULT</span></div>

        <div class="BarraEstado" id="BarraEstado">
            <div class="PuntoEstado"></div>

            <span class="IconoEstado" id="EnvoltorioIconoEstado" style="display:none;">
                <i id="IconoEstado" data-lucide="gamepad-2"></i>
            </span>

            <span class="TextoEstado" id="TextoEstado">Listo Para Jugar</span>
        </div>
    </header>

    <div class="Aplicacion">

        <!------ Barra Lateral Izquierda ------->

        <div class="BarraLateral">
            <div class="EncabezadoBarraLateral">
                <div class="TituloBarraLateral">Consolas</div>

                <div class="PestañasConsola">
                    <button class="PestañaConsola Activa" data-consola="nes">NES</button>
                    <button class="PestañaConsola"        data-consola="ps1">PS1</button>
                </div>
            </div>

            <div class="ListaJuegos" id="ListaJuego"></div>

            <div class="AccionesBarraLateral">
                <button class="BotonControl Principal" id="BotonIniciar" onclick="IniciarRom()" disabled>
                    <i class="ti ti-player-play" aria-hidden="true"></i> INICIAR
                </button>
                <button class="BotonControl Peligro" onclick="DetenerJuego()">
                    <i class="ti ti-player-stop" aria-hidden="true"></i> DETENER
                </button>
            </div>
        </div>

        <!------- Area Central Del Emulador -------->

        <div class="AreaEmulador">
            <div class="EnvoltorioEmulador">
                <div class="MarcoEmulador">
                
                    <!----- Pantalla De Bienvenida ----->
                    
                    <div class="PantallaInicio" id="PantallaInicio">
                        <div class="LogoInicio">INSERT COIN</div>
                        <div class="SubtituloInicio">RetroVault v1.0</div>

                        <div class="FlechaInicio">
                            <i class="ti ti-coin" aria-hidden="true"></i>
                            <span>ELIGE UN JUEGO PARA COMENZAR</span>
                        </div>
                    </div>

                    <!------- Pantalla De Carga -------->

                    <div class="PantallaCarga" id="PantallaCarga">
                        <div class="TituloCarga" id="TituloCarga">CARGANDO...</div>
                        
                        <div class="EnvoltorioBarra">
                            <div class="BarraCarga" id="BarraCarga"></div>
                        </div>
                    </div>

                    <iframe allow="fullscreen *; autoplay *" id="IframeEmulador"></iframe>
                </div>
            </div>
        </div>

        <!--- Barra Lateral Derecha (Controles) ---->

        <div class="BarraLateralControles">
            <div class="EncabezadoBarraLateral">
                <div class="TituloBarraLateral">Controles</div>
            </div>

            <div class="PanelControles" id="PanelControles"></div>
        </div>
    </div>

    <script src="Logica.js"></script>
</body>
</html>
