<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retro Vault</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Estilos.css">

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

    <!------------- Cabecera TopBar ------------>
    
    <header class="Cabecera">
        <div class="Logo">RETRO<span>VAULT</span></div>

        <div class="BarraEstado" id="BarraEstado">
            <div class="PuntoEstado"></div>

            <span class="IconoEstado" id="EnvoltorioIconoEstado" style="display:none;">
                <i id="IconoEstado" data-lucide="gamepad-2"></i>
            </span>

            <span class="TextoEstado" id="TextoEstado">Listo Para Jugar</span>
        </div>
    </header>

    <div class="Aplicacion">

        <!------ Barra Lateral Izquierda ------->

        <div class="BarraLateral">
            <div class="EncabezadoBarraLateral">
                <div class="TituloBarraLateral">Consolas</div>

                <div class="PestañasConsola">
                    <button class="PestañaConsola Activa" data-consola="nes">NES</button>
                    <button class="PestañaConsola"        data-consola="ps1">PS1</button>
                </div>
            </div>

            <div class="ListaJuegos" id="ListaJuegos"></div>

            <div class="AccionesBarraLateral">
                <button class="BotonControl Principal" id="BotonIniciar" onclick="IniciarRom()" disabled>
                    <i class="ti ti-player-play" aria-hidden="true"></i> INICIAR
                </button>
                <button class="BotonControl Peligro" onclick="DetenerJuego()">
                    <i class="ti ti-player-stop" aria-hidden="true"></i> DETENER
                </button>
            </div>
        </div>
    </div>
    
</body>
</html>
